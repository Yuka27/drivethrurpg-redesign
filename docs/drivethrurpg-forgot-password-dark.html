<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot password modal — DriveThruRPG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background: oklch(0.145 0 0);
        --foreground: oklch(0.985 0 0);
        --card: oklch(0.205 0 0);
        --primary: #d8413f;
        --primary-foreground: oklch(0.98 0.016 73.684);
        --secondary: oklch(0.274 0.006 286.033);
        --muted: oklch(0.269 0 0);
        --muted-foreground: oklch(0.708 0 0);
        --destructive: oklch(0.704 0.191 22.216);
        --success: #5cc489;
        --warn: #e0a43a;
        --border: oklch(1 0 0 / 10%);
        --input: oklch(1 0 0 / 15%);
        --radius: 0.625rem;
      }
      * {
        box-sizing: border-box;
      }
      html {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: 'Inter', system-ui, sans-serif;
        line-height: 1.45;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1,
      h2,
      h3 {
        font-family: 'Sora', system-ui, sans-serif;
        color: #fff;
        letter-spacing: -0.01em;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font-family: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      /* ---------- mockup chrome (not part of the design) ---------- */
      .wrap {
        max-width: 1240px;
        margin: 0 auto;
        padding: 30px 24px 60px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 22px;
      }
      .top h1 {
        font:
          800 1.8rem 'Sora',
          sans-serif;
      }
      .top p {
        color: var(--muted-foreground);
        margin-top: 6px;
        font-size: 0.9rem;
        max-width: 62ch;
      }
      .ctl {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .sg {
        display: inline-flex;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 3px;
        flex-wrap: wrap;
      }
      .sg button {
        background: none;
        border: 0;
        border-radius: 999px;
        color: var(--muted-foreground);
        font-size: 0.82rem;
        font-weight: 500;
        padding: 8px 16px;
        cursor: pointer;
        min-height: 36px;
      }
      .sg button.on {
        background: var(--foreground);
        color: var(--background);
        font-weight: 600;
      }
      .dev {
        margin: 0 auto;
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        background: var(--background);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        max-width: 1240px;
        transition: max-width 0.25s;
      }
      body.m .dev {
        max-width: 400px;
      }

      /* ---------- focus-layout header ---------- */
      .hbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 28px;
        border-bottom: 1px solid var(--border);
      }
      .logo {
        font:
          800 1.15rem 'Sora',
          sans-serif;
        color: var(--primary);
      }
      .hr {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 0.84rem;
        color: var(--muted-foreground);
      }
      .hr .lang {
        border: 1px solid var(--border);
        background: var(--secondary);
        color: var(--foreground);
        border-radius: var(--radius);
        padding: 7px 12px;
        font-size: 0.78rem;
        font-weight: 600;
        cursor: pointer;
      }
      .hr .login {
        color: var(--foreground);
        font-weight: 600;
        border: 1px solid var(--border);
        background: var(--secondary);
        border-radius: var(--radius);
        padding: 8px 14px;
        cursor: pointer;
      }
      .hr .q {
        white-space: nowrap;
      }
      body.m .hbar {
        padding: 12px 16px;
      }
      body.m .hr .q {
        display: none;
      }

      /* ---------- stage ---------- */
      .stage {
        padding: 44px 28px 56px;
        background: radial-gradient(
          90% 60% at 100% 0%,
          color-mix(in oklch, var(--primary) 9%, transparent),
          transparent 60%
        );
      }
      .reg {
        display: grid;
        grid-template-columns: minmax(0, 460px) minmax(0, 400px);
        gap: 48px;
        justify-content: center;
        align-items: start;
      }
      body.m .stage {
        padding: 22px 16px 34px;
      }
      body.m .reg {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 30px 30px 26px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }
      body.m .card {
        padding: 22px 18px 20px;
        border-radius: 16px;
      }
      .card h1 {
        font-size: 1.6rem;
        line-height: 1.2;
        font-weight: 800;
      }
      body.m .card h1 {
        font-size: 1.4rem;
      }
      .card .sub {
        color: var(--muted-foreground);
        font-size: 0.9rem;
        margin-top: 6px;
      }

      .ctx {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        margin-top: 16px;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid color-mix(in oklch, var(--primary) 35%, var(--border));
        background: color-mix(in oklch, var(--primary) 9%, transparent);
        font-size: 0.82rem;
      }
      .ctx svg {
        flex: none;
        margin-top: 1px;
        color: var(--primary);
      }
      .ctx b {
        color: #fff;
      }

      /* social sign-up */
      .sso {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 20px;
      }
      .sso button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: var(--secondary);
        border: 1px solid var(--border);
        color: var(--foreground);
        border-radius: 10px;
        padding: 11px 8px;
        font-weight: 600;
        font-size: 0.86rem;
        cursor: pointer;
        min-height: 44px;
      }
      .sso button:hover {
        border-color: color-mix(in oklch, var(--foreground) 35%, var(--border));
      }
      .gl {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 0.72rem;
        flex: none;
      }
      .gl.g {
        background: #fff;
        color: #4285f4;
      }
      .gl.f {
        background: #3b5998;
        color: #fff;
      }
      .gl.r {
        background: var(--primary);
        color: #fff;
      }
      body.m .sso button {
        font-size: 0.8rem;
        padding: 11px 4px;
        gap: 6px;
      }
      .or {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted-foreground);
        font-size: 0.78rem;
        margin: 20px 0 18px;
      }
      .or::before,
      .or::after {
        content: '';
        height: 1px;
        background: var(--border);
        flex: 1;
      }

      /* error summary */
      .alert {
        display: flex;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid
          color-mix(in oklch, var(--destructive) 55%, transparent);
        background: color-mix(in oklch, var(--destructive) 12%, transparent);
        font-size: 0.86rem;
        margin-bottom: 16px;
      }
      .alert svg {
        flex: none;
        color: var(--destructive);
        margin-top: 1px;
      }
      .alert b {
        display: block;
        color: #fff;
        margin-bottom: 2px;
      }
      .alert ul {
        margin: 2px 0 0;
        padding-left: 18px;
      }
      .alert a {
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }
      .alert .retry {
        margin-top: 8px;
        background: var(--secondary);
        border: 1px solid var(--border);
        color: var(--foreground);
        border-radius: 8px;
        padding: 7px 12px;
        font-weight: 600;
        font-size: 0.82rem;
        cursor: pointer;
      }

      /* fields */
      .fld {
        margin-bottom: 16px;
      }
      .fld label {
        display: block;
        font-size: 0.82rem;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .inp {
        position: relative;
      }
      .inp input[type='email'],
      .inp input[type='text'],
      .inp input[type='password'] {
        width: 100%;
        background: var(--input);
        border: 1px solid var(--border);
        color: var(--foreground);
        border-radius: 10px;
        padding: 13px 14px;
        font-family: inherit;
        font-size: 0.95rem;
        outline: none;
        min-height: 48px;
      }
      .inp input::placeholder {
        color: var(--muted-foreground);
      }
      .inp input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px
          color-mix(in oklch, var(--primary) 25%, transparent);
      }
      .inp input:disabled {
        opacity: 0.6;
      }
      .inp.pw input {
        padding-right: 50px;
      }
      .eye {
        position: absolute;
        right: 5px;
        top: 50%;
        transform: translateY(-50%);
        width: 40px;
        height: 40px;
        border: none;
        background: none;
        color: var(--muted-foreground);
        cursor: pointer;
        border-radius: 8px;
        display: grid;
        place-items: center;
      }
      .eye:hover {
        color: var(--foreground);
      }
      .fld.err input {
        border-color: var(--destructive);
      }
      .fld.err input:focus {
        box-shadow: 0 0 0 3px
          color-mix(in oklch, var(--destructive) 28%, transparent);
      }
      .msg {
        display: none;
        align-items: flex-start;
        gap: 6px;
        color: var(--destructive);
        font-size: 0.8rem;
        margin-top: 6px;
      }
      .fld.err .msg {
        display: flex;
      }
      .msg svg {
        flex: none;
        margin-top: 2px;
      }
      .msg a {
        color: #fff;
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }

      /* password strength */
      .meter {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
        margin-top: 10px;
      }
      .meter i {
        height: 4px;
        border-radius: 99px;
        background: var(--muted);
        transition: background 0.2s;
      }
      .mrow {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 7px;
        font-size: 0.78rem;
        color: var(--muted-foreground);
        min-height: 18px;
      }
      .mrow b {
        font-weight: 600;
      }
      .reqs {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
        display: grid;
        gap: 5px;
        font-size: 0.8rem;
        color: var(--muted-foreground);
      }
      .reqs li {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .reqs .d {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 1px solid var(--border);
        display: grid;
        place-items: center;
        flex: none;
        font-size: 0.62rem;
        color: transparent;
      }
      .reqs li.ok {
        color: var(--foreground);
      }
      .reqs li.ok .d {
        background: var(--success);
        border-color: var(--success);
        color: #0b1a12;
        font-weight: 800;
      }

      /* checkbox */
      .chk {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        font-size: 0.86rem;
        margin: 4px 0 18px;
        cursor: pointer;
        user-select: none;
      }
      .chk input {
        position: absolute;
        opacity: 0;
      }
      .chk .bx {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--input);
        display: grid;
        place-items: center;
        flex: none;
        margin-top: 1px;
      }
      .chk input:checked + .bx {
        background: var(--primary);
        border-color: var(--primary);
      }
      .chk input:checked + .bx::after {
        content: '✓';
        color: #fff;
        font-size: 0.72rem;
      }
      .chk input:focus-visible + .bx {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      .chk small {
        display: block;
        color: var(--muted-foreground);
        font-size: 0.76rem;
        margin-top: 2px;
      }

      .go {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: var(--primary);
        color: var(--primary-foreground);
        border: none;
        border-radius: 10px;
        padding: 14px;
        font-weight: 700;
        font-size: 0.98rem;
        cursor: pointer;
        min-height: 50px;
      }
      .go:hover {
        filter: brightness(1.08);
      }
      .go[disabled] {
        opacity: 0.85;
        cursor: progress;
      }
      .go.ghost {
        background: var(--secondary);
        color: var(--foreground);
        border: 1px solid var(--border);
      }
      .spin {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: #fff;
        animation: sp 0.7s linear infinite;
      }
      @keyframes sp {
        to {
          transform: rotate(360deg);
        }
      }
      .legal {
        text-align: center;
        color: var(--muted-foreground);
        font-size: 0.76rem;
        margin-top: 14px;
        line-height: 1.5;
      }
      .legal a,
      .have a {
        color: var(--foreground);
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }
      .have {
        text-align: center;
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid var(--border);
        font-size: 0.88rem;
        color: var(--muted-foreground);
      }
      .have a {
        color: var(--primary);
        font-weight: 700;
        text-decoration: none;
      }

      /* benefits panel */
      .why {
        border-radius: 18px;
        border: 1px solid var(--border);
        padding: 30px;
        background:
          radial-gradient(
            130% 120% at 0% 0%,
            color-mix(in oklch, var(--primary) 26%, transparent),
            transparent 58%
          ),
          linear-gradient(135deg, #1b1420, #241018);
      }
      .why .eyebrow {
        color: color-mix(in oklch, var(--primary) 70%, #fff);
        font-weight: 700;
        font-size: 0.74rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .why h2 {
        font-size: 1.35rem;
        line-height: 1.25;
        margin: 8px 0 20px;
      }
      .ben {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 16px;
      }
      .ben li {
        display: grid;
        grid-template-columns: 36px 1fr;
        gap: 12px;
        align-items: start;
      }
      .ben .ic {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid var(--border);
        display: grid;
        place-items: center;
        color: #fff;
      }
      .ben b {
        display: block;
        font-size: 0.92rem;
        color: #fff;
      }
      .ben span {
        color: var(--muted-foreground);
        font-size: 0.82rem;
      }
      .why .trust svg {
        flex: none;
      }
      .why .trust {
        margin-top: 22px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 8px;
        align-items: center;
        color: var(--muted-foreground);
        font-size: 0.8rem;
      }
      .whym {
        display: none;
      }
      body.m .why {
        display: none;
      }
      body.m .mrow #mTip {
        display: none;
      }
      body.m .whym {
        display: block;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 0;
      }
      .whym summary {
        list-style: none;
        cursor: pointer;
        padding: 14px 16px;
        font-weight: 700;
        font-size: 0.9rem;
        font-family: 'Sora', sans-serif;
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 48px;
      }
      .whym summary::-webkit-details-marker {
        display: none;
      }
      .whym summary::after {
        content: '+';
        color: var(--muted-foreground);
        font-size: 1.1rem;
        font-weight: 400;
      }
      .whym[open] summary::after {
        content: '−';
      }
      .whym .ben {
        padding: 2px 16px 18px;
      }

      /* success */
      .ok-ic {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: color-mix(in oklch, var(--success) 18%, transparent);
        border: 1px solid color-mix(in oklch, var(--success) 50%, transparent);
        display: grid;
        place-items: center;
        color: var(--success);
        margin-bottom: 16px;
      }
      .mail {
        display: flex;
        gap: 10px;
        align-items: center;
        margin: 18px 0;
        padding: 12px 14px;
        border-radius: 10px;
        background: var(--background);
        border: 1px solid var(--border);
        font-size: 0.88rem;
        overflow-wrap: anywhere;
      }
      .mail svg {
        flex: none;
        color: var(--muted-foreground);
      }
      .next {
        display: grid;
        gap: 10px;
        margin-top: 6px;
      }
      .sm {
        margin-top: 16px;
        text-align: center;
        font-size: 0.82rem;
        color: var(--muted-foreground);
      }
      .sm a {
        color: var(--foreground);
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }
      .kept {
        display: flex;
        gap: 8px;
        align-items: center;
        color: var(--muted-foreground);
        font-size: 0.82rem;
        margin-top: 14px;
      }
      .kept svg {
        color: var(--success);
      }

      /* notes under the frame */
      .notes {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-top: 26px;
      }
      .note {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
      }
      .note h3 {
        font-size: 0.86rem;
        margin-bottom: 6px;
      }
      .note p {
        color: var(--muted-foreground);
        font-size: 0.8rem;
      }
      .note code {
        font-size: 0.74rem;
        background: var(--muted);
        padding: 1px 5px;
        border-radius: 4px;
        color: var(--foreground);
      }
      @media (max-width: 1000px) {
        .notes {
          grid-template-columns: 1fr 1fr;
        }
        .reg {
          grid-template-columns: minmax(0, 460px);
        }
        .why {
          display: none;
        }
        .whym {
          display: block;
          background: var(--card);
          border: 1px solid var(--border);
          border-radius: 14px;
        }
      }
      @media (max-width: 560px) {
        .notes {
          grid-template-columns: 1fr;
        }
        .wrap {
          padding: 20px 16px 40px;
        }
        .sso button {
          font-size: 0.8rem;
        }
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translate(-50%, 20px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 18px;
        font-size: 0.88rem;
        opacity: 0;
        transition: 0.25s;
        z-index: 300;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          transition: none !important;
        }
      }

      /* forgot-password additions */
      .stage.one {
        padding: 56px 28px 72px;
      }
      body.m .stage.one {
        padding: 22px 16px 34px;
      }
      .solo {
        max-width: 440px;
        margin: 0 auto;
      }
      .ico {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--secondary);
        border: 1px solid var(--border);
        color: #fff;
        margin-bottom: 18px;
      }
      .ico.ok {
        background: color-mix(in oklch, var(--success) 18%, transparent);
        border-color: color-mix(in oklch, var(--success) 50%, transparent);
        color: var(--success);
      }
      .ico.warn {
        background: color-mix(in oklch, var(--warn) 16%, transparent);
        border-color: color-mix(in oklch, var(--warn) 50%, transparent);
        color: var(--warn);
      }
      .tips {
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 10px;
        background: var(--background);
        border: 1px solid var(--border);
        font-size: 0.84rem;
        color: var(--muted-foreground);
      }
      .tips b {
        display: block;
        color: #fff;
        margin-bottom: 4px;
        font-size: 0.86rem;
      }
      .tips ul {
        margin: 0;
        padding-left: 18px;
        display: grid;
        gap: 4px;
      }
      .tips a {
        color: var(--foreground);
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }
      .go.plain {
        background: none;
        border-color: transparent;
        color: var(--muted-foreground);
        font-weight: 600;
      }
      .go.plain:hover {
        color: var(--foreground);
      }
      .go.ghost[disabled] {
        opacity: 0.6;
      }
      .bk {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        color: var(--foreground) !important;
        font-weight: 600;
        cursor: pointer;
      }
      .have .bk {
        text-decoration: none;
      }
      .sg + .sg {
        margin-left: 0;
      }
      .card .legal {
        text-align: left;
      }

      /* modal-only prototype */
      body {
        background: var(--background);
      }
      .wrap {
        max-width: 560px;
        padding: 20px 16px 48px;
      }
      .top {
        margin-bottom: 18px;
      }
      .stage,
      .stage.one {
        background: none;
        padding: 0;
        max-width: 440px;
        margin: 0 auto;
      }
      body.m .stage,
      body.m .stage.one {
        max-width: 380px;
        padding: 0;
      }
      .card {
        position: relative;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      }
      .lm-x {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted-foreground);
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .lm-x:hover {
        background: var(--secondary);
        color: var(--foreground);
      }
      .card h1 {
        padding-right: 44px;
      }
      .ico {
        margin-bottom: 14px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div></div>
        <div class="ctl">
          <div
            class="sg"
            id="s1"
            role="group"
            aria-label="Step 1: request a link"
          >
            <button data-s="req" class="on">1 · Request</button>
            <button data-s="req_err">Invalid email</button>
            <button data-s="req_load">Sending</button>
            <button data-s="sent">Email sent</button>
            <button data-s="limited">Rate limited</button>
          </div>
          <div
            class="sg"
            id="s2"
            role="group"
            aria-label="Step 2: new password"
          >
            <button data-s="reset">2 · New password</button>
            <button data-s="reset_err">Too short</button>
            <button data-s="expired">Link expired</button>
            <button data-s="done">Done</button>
          </div>
          <div class="sg" id="dm" role="group" aria-label="Device">
            <button data-m="d" class="on">Desktop</button>
            <button data-m="m">Mobile</button>
          </div>
        </div>
      </div>

      <div class="stage one" id="stage"></div>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script>
      var $ = function (s) {
        return document.querySelector(s)
      }
      var st = 'req',
        pwShown = false,
        timer = null,
        secs = 0
      var EMAIL = 'arya@example.com'
      var I = {
        key: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M16 7l3 3M14 9l2 2"/></svg>',
        mail: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
        check:
          '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.500 4.500L19 7.500"/></svg>',
        clock:
          '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
        warn: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20zM12 10v4M12 17h.01"/></svg>',
        info: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
        eye: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.500-7 10-7 10 7 10 7-3.500 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
        eyeoff:
          '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 6.100A10 10 0 0 1 12 5c6.500 0 10 7 10 7a17 17 0 0 1-3.200 4M6.600 6.600A17 17 0 0 0 2 12s3.500 7 10 7c1.600 0 3-.4 4.300-1M9.900 9.900a3 3 0 0 0 4.200 4.200"/></svg>',
        back: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
      }
      function msg(t) {
        return (
          '<span class="msg" aria-live="polite">' +
          I.warn +
          '<span>' +
          t +
          '</span></span>'
        )
      }
      function back() {
        return (
          '<p class="have"><a class="bk" data-toast="Go to log in (demo)">' +
          I.back +
          ' Back to log in</a></p>'
        )
      }
      function tick() {
        if (secs > 0) {
          secs--
          paint()
        }
        if (secs <= 0) {
          clearInterval(timer)
          timer = null
        }
      }
      function startTimer(n) {
        secs = n
        clearInterval(timer)
        timer = setInterval(tick, 1000)
      }
      function paint() {
        var b = $('#resend')
        if (b) {
          b.disabled = secs > 0
          b.textContent =
            secs > 0 ? 'Resend email in ' + secs + 's' : 'Resend email'
        }
        var l = $('#go')
        if (l && st === 'limited') {
          l.disabled = secs > 0
          l.textContent =
            secs > 0 ? 'Try again in ' + secs + 's' : 'Send reset link'
        }
        var r = $('#retryTxt')
        if (r)
          r.textContent =
            secs > 0
              ? 'Too many requests. You can try again in ' + secs + ' seconds.'
              : 'You can try again now.'
      }

      function reqHtml() {
        var err = st === 'req_err',
          load = st === 'req_load',
          lim = st === 'limited'
        var val = err ? 'arya@example' : load || lim ? EMAIL : ''
        return (
          '' +
          '<form class="card" id="form" novalidate aria-labelledby="ttl">' +
          '<button type="button" class="lm-x" aria-label="Close" data-toast="Close modal (demo)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>' +
          '<div class="ico" aria-hidden="true">' +
          I.key +
          '</div>' +
          '<h1 id="ttl">Forgot your password?</h1>' +
          '<p class="sub">Enter the email you signed up with and we will send you a link to choose a new one.</p>' +
          (lim
            ? '<div class="alert" role="alert" style="margin-top:18px">' +
              I.warn +
              '<div><b>Slow down a little</b><span id="retryTxt"></span></div></div>'
            : '') +
          '<div class="fld' +
          (err ? ' err' : '') +
          '" id="fEmail" style="margin-top:20px">' +
          '<label for="email">Email</label>' +
          '<div class="inp"><input id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" value="' +
          val +
          '"' +
          (load ? ' disabled' : '') +
          ' aria-describedby="mEmail"' +
          (err ? ' aria-invalid="true"' : '') +
          '></div>' +
          '<div id="mEmail">' +
          (err
            ? msg('Enter a valid email address, for example name@example.com.')
            : '') +
          '</div>' +
          '</div>' +
          '<button class="go" id="go" type="submit"' +
          (load || lim ? ' disabled' : '') +
          '>' +
          (load ? '<span class="spin"></span>Sending…' : 'Send reset link') +
          '</button>' +
          '<p class="legal">Signed up with Google, Facebook or Roll20? You do not have a password, just use that button to log in.</p>' +
          back() +
          '</form>'
        )
      }

      function sentHtml() {
        return (
          '' +
          '<section class="card" aria-labelledby="ttl">' +
          '<button type="button" class="lm-x" aria-label="Close" data-toast="Close modal (demo)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>' +
          '<div class="ico ok" aria-hidden="true">' +
          I.mail +
          '</div>' +
          '<h1 id="ttl">Check your email</h1>' +
          '<p class="sub">If an account exists for <b style="color:#fff;overflow-wrap:anywhere">' +
          EMAIL +
          '</b>, we have sent a link to reset your password. The link works once and expires in 1 hour.</p>' +
          '<div class="tips"><b>Nothing in your inbox?</b><ul><li>Look in spam, promotions or other tabs.</li><li>Make sure the address is the one you signed up with.</li><li>If you signed up with Google, Facebook or Roll20, log in with that button instead.</li></ul></div>' +
          '<div class="next" style="margin-top:20px">' +
          '<button class="go ghost" type="button" id="resend" disabled>Resend email in 30s</button>' +
          '<button class="go ghost plain" type="button" id="diff">Use a different email</button>' +
          '</div>' +
          back() +
          '</section>'
        )
      }

      function resetHtml() {
        var err = st === 'reset_err',
          v = err ? 'needle' : ''
        return (
          '' +
          '<form class="card" id="form" novalidate aria-labelledby="ttl">' +
          '<button type="button" class="lm-x" aria-label="Close" data-toast="Close modal (demo)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>' +
          '<div class="ico" aria-hidden="true">' +
          I.key +
          '</div>' +
          '<h1 id="ttl">Set a new password</h1>' +
          '<p class="sub">For the account <b style="color:#fff">a***@example.com</b>. Choose something you have not used on this site before.</p>' +
          '<div class="fld' +
          (err ? ' err' : '') +
          '" id="fPw" style="margin-top:20px">' +
          '<label for="pw">New password</label>' +
          '<div class="inp pw"><input id="pw" type="' +
          (pwShown ? 'text' : 'password') +
          '" autocomplete="new-password" placeholder="At least 10 characters" value="' +
          v +
          '" aria-describedby="mPw reqs"' +
          (err ? ' aria-invalid="true"' : '') +
          '>' +
          '<button type="button" class="eye" id="eye" aria-label="' +
          (pwShown ? 'Hide password' : 'Show password') +
          '">' +
          (pwShown ? I.eyeoff : I.eye) +
          '</button></div>' +
          '<div id="mPw">' +
          (err ? msg('Use at least 10 characters.') : '') +
          '</div>' +
          '<div class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></div>' +
          '<div class="mrow"><span id="mLbl" aria-live="polite"></span><span id="mTip"></span></div>' +
          '<ul class="reqs" id="reqs"><li id="rLen"><span class="d">✓</span>At least 10 characters</li></ul>' +
          '</div>' +
          '<button class="go" id="go" type="submit">Update password</button>' +
          '<p class="legal">This link can be used once. After you save, we sign you out on all other devices.</p>' +
          '</form>'
        )
      }

      function expiredHtml() {
        return (
          '' +
          '<section class="card" aria-labelledby="ttl">' +
          '<button type="button" class="lm-x" aria-label="Close" data-toast="Close modal (demo)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>' +
          '<div class="ico warn" aria-hidden="true">' +
          I.clock +
          '</div>' +
          '<h1 id="ttl">This link has expired</h1>' +
          '<p class="sub">Reset links work once and for 1 hour. This one was already used or is too old. It happens, we can send you a new one.</p>' +
          '<div class="next" style="margin-top:22px">' +
          '<button class="go" type="button" id="newlink">Send me a new link</button>' +
          '</div>' +
          back() +
          '</section>'
        )
      }

      function doneHtml() {
        return (
          '' +
          '<section class="card" aria-labelledby="ttl">' +
          '<button type="button" class="lm-x" aria-label="Close" data-toast="Close modal (demo)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>' +
          '<div class="ico ok" aria-hidden="true">' +
          I.check +
          '</div>' +
          '<h1 id="ttl">Password updated</h1>' +
          '<p class="sub">You can now log in with your new password. For your safety we signed you out on all other devices.</p>' +
          '<div class="next" style="margin-top:22px">' +
          '<button class="go" type="button" data-toast="Go to log in (demo)">Log in</button>' +
          '</div>' +
          '<div class="tips" style="margin-top:18px"><b>Was this not you?</b><ul><li>We sent a notice to a***@example.com. If you did not ask for this, <a data-toast="Contact support (demo)">contact support</a> right away.</li></ul></div>' +
          '</section>'
        )
      }

      function render() {
        clearInterval(timer)
        timer = null
        var h = {
          req: reqHtml,
          req_err: reqHtml,
          req_load: reqHtml,
          limited: reqHtml,
          sent: sentHtml,
          reset: resetHtml,
          reset_err: resetHtml,
          expired: expiredHtml,
          done: doneHtml,
        }[st]()
        $('#stage').innerHTML = '<div class="solo">' + h + '</div>'
        if (st === 'sent') startTimer(30)
        if (st === 'limited') startTimer(30)
        bind()
        paint()
        updatePw()
      }

      function score(v) {
        if (!v) return 0
        if (v.length < 10) return 1
        var c =
            (/[a-z]/.test(v) ? 1 : 0) +
            (/[A-Z]/.test(v) ? 1 : 0) +
            (/\d/.test(v) ? 1 : 0) +
            (/[^A-Za-z0-9]/.test(v) ? 1 : 0),
          s = 2
        if (v.length >= 14 || (v.length >= 12 && c >= 3)) s = 3
        if (v.length >= 18 || (v.length >= 14 && c >= 3)) s = 4
        return s
      }
      var LBL = ['', 'Too short', 'Okay', 'Good', 'Strong'],
        COL = [
          '',
          'var(--destructive)',
          'var(--warn)',
          'var(--success)',
          'var(--success)',
        ]
      function updatePw() {
        var pw = $('#pw')
        if (!pw) return
        var v = pw.value,
          s = score(v)
        document.querySelectorAll('.meter i').forEach(function (b, i) {
          b.style.background = i < s ? COL[s] : ''
        })
        $('#mLbl').innerHTML = s
          ? 'Password strength: <b style="color:' +
            COL[s] +
            '">' +
            LBL[s] +
            '</b>'
          : ''
        $('#mTip').textContent =
          s && s < 3 ? 'Tip: a few random words work well' : ''
        $('#rLen').classList.toggle('ok', v.length >= 10)
      }
      function toast(t) {
        var el = $('#toast')
        el.textContent = t
        el.classList.add('show')
        clearTimeout(toast.t)
        toast.t = setTimeout(function () {
          el.classList.remove('show')
        }, 2200)
      }
      function setErr(id, mid, on, t) {
        var f = $('#' + id)
        f.classList.toggle('err', on)
        var i = f.querySelector('input')
        on
          ? i.setAttribute('aria-invalid', 'true')
          : i.removeAttribute('aria-invalid')
        $('#' + mid).innerHTML = on ? msg(t) : ''
      }

      function bind() {
        document.querySelectorAll('[data-toast]').forEach(function (b) {
          b.addEventListener('click', function () {
            toast(b.getAttribute('data-toast'))
          })
        })
        var rs = $('#resend')
        if (rs)
          rs.addEventListener('click', function () {
            toast('Another email is on its way (demo)')
            startTimer(30)
            paint()
          })
        var d = $('#diff')
        if (d)
          d.addEventListener('click', function () {
            setState('req')
          })
        var nl = $('#newlink')
        if (nl)
          nl.addEventListener('click', function () {
            setState('req')
          })
        var f = $('#form')
        if (!f) return
        var eye = $('#eye')
        if (eye) {
          eye.addEventListener('click', function () {
            pwShown = !pwShown
            var v = $('#pw').value
            render()
            $('#pw').value = v
            updatePw()
            $('#pw').focus()
          })
          $('#pw').addEventListener('input', function () {
            updatePw()
            if ($('#fPw').classList.contains('err') && this.value.length >= 10)
              setErr('fPw', 'mPw', false)
          })
        }
        var em = $('#email')
        if (em)
          em.addEventListener('input', function () {
            if ($('#fEmail').classList.contains('err'))
              setErr('fEmail', 'mEmail', false)
          })
        f.addEventListener('submit', function (e) {
          e.preventDefault()
          if ($('#email')) {
            var v = $('#email').value.trim(),
              ok = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)
            setErr(
              'fEmail',
              'mEmail',
              !ok,
              'Enter a valid email address, for example name@example.com.',
            )
            if (!ok) {
              $('#email').focus()
              return
            }
            EMAIL = v
            var b = $('#go')
            b.disabled = true
            b.innerHTML = '<span class="spin"></span>Sending…'
            setTimeout(function () {
              setState('sent')
            }, 900)
          } else {
            var p = $('#pw').value,
              okp = p.length >= 10
            setErr('fPw', 'mPw', !okp, 'Use at least 10 characters.')
            if (!okp) {
              $('#pw').focus()
              return
            }
            var b2 = $('#go')
            b2.disabled = true
            b2.innerHTML = '<span class="spin"></span>Saving…'
            setTimeout(function () {
              setState('done')
            }, 900)
          }
        })
      }
      function setState(s) {
        st = s
        document
          .querySelectorAll('#s1 button,#s2 button')
          .forEach(function (b) {
            b.classList.toggle('on', b.dataset.s === s)
          })
        render()
      }
      document.querySelectorAll('#s1 button,#s2 button').forEach(function (b) {
        b.addEventListener('click', function () {
          setState(b.dataset.s)
        })
      })
      document.querySelectorAll('#dm button').forEach(function (b) {
        b.addEventListener('click', function () {
          document.body.classList.toggle('m', b.dataset.m === 'm')
          document.querySelectorAll('#dm button').forEach(function (x) {
            x.classList.toggle('on', x === b)
          })
        })
      })
      render()
    </script>
  </body>
</html>
